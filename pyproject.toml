[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-idea-ledger"
version = "0.1.0"
description = "An append-only ledger of ideas taken from GitHub repos - ideas only, never their code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ADZ" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
idea-ledger = "idea_ledger.cli:main"

[tool.setuptools]
packages = ["idea_ledger"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
